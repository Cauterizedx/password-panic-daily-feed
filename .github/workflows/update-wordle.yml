name: Update daily Wordle feed

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-wordle-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feed
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download and validate today's answer
        run: python scripts/update_wordle.py

      - name: Publish changed feed
        shell: bash
        run: |
          if git diff --quiet -- current.txt meta.json; then
            echo "Feed is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current.txt meta.json
          git commit -m "Update daily Wordle feed"
          git push
